name: Validate OKF bundle

on:
  push:
    paths: ["laws/**", "tools/**"]
  pull_request:
    paths: ["laws/**", "tools/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/okf_bundle.py check laws
