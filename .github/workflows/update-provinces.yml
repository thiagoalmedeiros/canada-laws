name: Update provincial laws

on:
  workflow_dispatch:
    inputs:
      jurisdictions:
        description: "Space-separated module codes (ab bc mb nb nl ns nt on pe qc sk yt). Empty = the PROVINCES repo variable, or all."
        required: false
        default: ""
  schedule:
    - cron: "17 7 * * 1" # Mondays 07:17 UTC

permissions:
  contents: write

concurrency:
  group: commit-to-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas pyarrow requests pyyaml

      - name: Convert, log, validate and commit one module at a time
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CODES: ${{ github.event.inputs.jurisdictions || vars.PROVINCES }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          codes=$(echo "${CODES:-ab bc mb nb nl ns nt on pe qc sk yt}" | tr 'A-Z' 'a-z')
          for code in $codes; do
            python3 tools/provincial_to_md.py laws "$code"
            python3 tools/okf_bundle.py credits laws
            git add -A laws
            if git diff --cached --quiet; then
              echo "$code: no changes"
              continue
            fi
            n=$(git diff --cached --name-only -- "laws/$code" | grep -v -E '/(index|log|overview)\.md$' | wc -l)
            python3 tools/okf_bundle.py log laws "$code" "**Update**: Refreshed from the A2AJ Canadian Laws dataset (${n} laws added, changed or removed)."
            python3 tools/okf_bundle.py log laws . "**Update**: [${code}](${code}/): ${n} laws added, changed or removed."
            python3 tools/okf_bundle.py check laws
            git add -A laws
            git commit -q -m "Update ${code} laws from A2AJ dataset ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do
              git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 10
            done
          done
